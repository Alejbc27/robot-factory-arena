# Self-hosted Langfuse v3.114.0 — local, downstream-only projection for
# `observability/`. Pins researched 2026-09-08 from the official sources
# recorded in docs/observability.md ("Pins and provenance"); every image is an
# exact compatible tag (never latest/major-only, checked by
# tests/observability/test_compose_docs.py). Only the Langfuse UI port 3000 is
# published. All credentials are environment-only and use non-empty ${VAR:?}
# guards — supply them in your shell or an uncommitted .env next to this file.
# The Langfuse S3 event-upload credentials reuse the MinIO root credentials
# (the official deployment defaults both pairs to the same values) — this
# stack provisions no separate MinIO user.
services:
  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:3.114.0
    restart: always
    depends_on: &langfuse-depends-on
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: &langfuse-env
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-langfuse}
      SALT: ${SALT:?set SALT (openssl rand -hex 32)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY (openssl rand -hex 32)}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_EVENT_UPLOAD_BUCKET:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      # Official v3.114.0 deployment defaults the upload credentials to the
      # same values as the MinIO root user/password and provisions no
      # separate user — derive them instead of duplicating prerequisites.
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_AUTH:?set REDIS_AUTH}
      REDIS_TLS_ENABLED: "false"
  langfuse-web:
    image: docker.io/langfuse/langfuse:3.114.0
    restart: always
    depends_on: *langfuse-depends-on
    ports:
      - "3000:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET}
    # The v3.114.0 images are alpine-based (official Dockerfiles), so busybox
    # wget is available for the public health endpoint.
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/public/health",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:24.3.18.7
    restart: always
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s
  minio:
    # The official v3.114.0 deployment needs no separate init container: this
    # entrypoint creates the `langfuse` bucket before serving (see docs).
    image: docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: always
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s
  redis:
    image: docker.io/redis:7.2.4
    restart: always
    command: >
      --requirepass ${REDIS_AUTH:?set REDIS_AUTH}
    environment:
      # Runtime-only supply for the healthcheck probe: $$ in the
      # healthcheck defers expansion to the container shell, so the
      # command is not host-interpolated into the composed config. The
      # password is still ordinary container configuration, readable by
      # any Docker-privileged user via container inspection or exec —
      # convenience, not secret protection.
      REDIS_AUTH: ${REDIS_AUTH:?set REDIS_AUTH}
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      # $$ defers expansion to the container shell, so the authenticated
      # ping (requirepass rejects an anonymous one) is not host-side
      # interpolated into the composed config; this does not hide the
      # password from Docker-privileged users.
      test:
        [
          "CMD-SHELL",
          'redis-cli --no-auth-warning -a "$$REDIS_AUTH" ping | grep -q PONG',
        ]
      interval: 3s
      timeout: 10s
      retries: 10
  postgres:
    image: docker.io/postgres:17.5
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-langfuse}
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-langfuse}",
        ]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  langfuse_postgres_data:
    driver: local
  langfuse_clickhouse_data:
    driver: local
  langfuse_clickhouse_logs:
    driver: local
  langfuse_minio_data:
    driver: local
  langfuse_redis_data:
    driver: local
