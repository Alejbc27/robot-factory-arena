# Optional red-check-only Langfuse v3.114.0 downstream smoke (CI-LF-01..05).
# Runs only for pull requests touching smoke-affecting surfaces and for manual
# dispatches — never on a schedule or push, and never as a required check.
# No repository or GitHub secrets: the smoke generates ephemeral credentials
# at runtime. The check is initially optional; required-check promotion is a
# later manual branch-protection decision and is never enacted here.
name: Langfuse smoke

on:
  pull_request:
    paths:
      - "observability/**"
      - "tests/observability/**"
      - ".github/workflows/langfuse-smoke.yml"
      - "scripts/langfuse_smoke.py"
      - "pyproject.toml"
      - "docs/observability.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: langfuse-smoke-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Run ephemeral smoke
        run: python3 scripts/langfuse_smoke.py
